<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}">
  {{- partial "header.html" . }}
  <main class="wrap">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- $js := resources.Get "js/terminal.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
