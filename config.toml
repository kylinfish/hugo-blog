baseURL = "https://kylinyu.win"
defaultContentLanguage = "zh-tw"
languageCode = "zh-TW"
hasCJKLanguage = true
title = "墨冊"
theme = "terminal"
paginate = 20
rssLimit = 20

[author]
  name = "Win Yu"
  email = ""
  authorlink = "https://kylinyu.win"

[params]
  subtitle = "筆墨日積終將成冊，知識月累便可結果"
  avatar = "/img/avatar-2.jpg"
  since = 2017
  images = ["/img/aboutme.jpg"]
  [params.social]
    github = "kylinfish"
    linkedin = "openwinyu"
    twitter = "kylinwin"
    email = "kylinfish@gmail.com"

[permalinks]
  posts = "/:filename"

[sitemap]
  filename = "sitemap.xml"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "所有文章"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "tags"
    name = "標籤"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    identifier = "categories"
    name = "分類"
    url = "/categories/"
    weight = 3
  [[menu.main]]
    identifier = "makelog"
    name = "造物誌"
    url = "/categories/造物誌/"
    title = "造物誌 · 用 coding agent 做的 side project"
    weight = 4
  [[menu.main]]
    identifier = "MySQL"
    name = "MySQL"
    url = "/tags/mysql/"
    title = "MySQL"
    weight = 5
  [[menu.main]]
    identifier = "es"
    name = "ElasticSearch"
    url = "/tags/elasticsearch/"
    title = "ElasticSearch"
    weight = 6
  [[menu.main]]
    identifier = "about"
    name = "AboutMe"
    url = "/about/"
    title = "AboutMe"
    weight = 7

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  taxonomyTerm = ["HTML"]
