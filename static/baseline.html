<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>00631L 基準線計算器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #070709;
    --bg-card:   #0e0f12;
    --bg-input:  #13141a;
    --border:    #1e2028;
    --border-hi: #2e3040;
    --amber:     #f0a500;
    --amber-dim: #7a5200;
    --text:      #c8cad4;
    --text-dim:  #4a4d5c;
    --text-hi:   #e8eaf2;
    --green:     #00c96e;
    --green-bg:  #001f10;
    --yellow:    #f5c518;
    --yellow-bg: #1f1800;
    --red:       #ff4545;
    --red-bg:    #1f0000;
    --purple:    #9d7eff;
    --purple-bg: #0f0a1e;
    --cyan:      #3ad6e0;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans TC', sans-serif;
  }

  /* ── LIGHT THEME ── */
  html.light {
    --bg:        #f4f1ea;
    --bg-card:   #ffffff;
    --bg-input:  #ece8df;
    --border:    #d6d0c4;
    --border-hi: #b8b0a0;
    --amber:     #a06200;
    --amber-dim: #c8963c;
    --text:      #2a2c36;
    --text-dim:  #888a98;
    --text-hi:   #08080e;
    --green:     #006838;
    --green-bg:  #e6f4ee;
    --yellow:    #6e5000;
    --yellow-bg: #fdf6d8;
    --red:       #b81c1c;
    --red-bg:    #fde8e8;
    --purple:    #5030b8;
    --purple-bg: #eeebf8;
    --cyan:      #0e6f78;
  }
  html.light .recal-alert {
    background: #fdf5e0;
    border-color: var(--amber-dim);
    border-left-color: var(--amber);
  }
  html.light .type-annual { background: #e4eeff; color: #1a50b8; border-color: #a8c0e8; }
  html.light .type-rule2  { background: #fff3d8; color: var(--amber); border-color: var(--amber-dim); }
  html.light .type-manual { background: #e8f3e0; color: #3a6020; border-color: #98c070; }
  html.light .status-bar  { background: var(--bg); }
  html.light .tl-dot      { background: var(--bg-card); }

  /* theme transition */
  html, body, header, .price-section, .zone-section, .thresholds,
  .threshold-card, .baseline-panel, .edit-panel, .history-item,
  .year-header, .timeline, .tl-dot,
  .recal-alert, .status-bar, .fetch-btn, .action-btn, .edit-input,
  .note-input, .clear-btn, .cancel-btn {
    transition: background-color 0.22s ease, border-color 0.22s ease, color 0.22s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .header-title {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .header-ticker {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--amber);
    letter-spacing: 0.05em;
  }
  .fetch-btn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .fetch-btn:active { background: var(--border); color: var(--amber); }
  .fetch-btn.loading { color: var(--amber); border-color: var(--amber-dim); }

  /* ── THEME TOGGLE ── */
  .header-right { display: flex; align-items: center; gap: 8px; }
  .theme-toggle {
    font-size: 17px;
    line-height: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 7px;
    cursor: pointer;
    transition: background-color 0.22s, border-color 0.22s;
    user-select: none;
  }
  .theme-toggle:active { background: var(--border); }

  /* ── MAIN PRICE DISPLAY ── */
  .price-section {
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
  }
  .price-label {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .price-row {
    display: flex;
    align-items: flex-end;
    gap: 12px;
  }
  .price-input-wrap {
    position: relative;
    flex: 1;
  }
  .price-input {
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 600;
    color: var(--amber);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    caret-color: var(--amber);
    letter-spacing: 0.02em;
  }
  .price-input::placeholder { color: var(--amber-dim); }
  .price-underline {
    height: 2px;
    background: linear-gradient(90deg, var(--amber) 0%, var(--amber-dim) 60%, transparent 100%);
    margin-top: 4px;
    border-radius: 1px;
  }
  .price-pct {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    padding-bottom: 6px;
    min-width: 60px;
    text-align: right;
  }

  /* ── ZONE BADGE ── */
  .zone-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .zone-badge {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .zone-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 8px currentColor;
  }
  .zone-name {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .zone-action {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.6;
    text-transform: uppercase;
  }

  /* ── THRESHOLD GRID ── */
  .thresholds {
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .threshold-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    position: relative;
    overflow: hidden;
  }
  .threshold-card.active-zone {
    border-color: var(--active-color, var(--border-hi));
  }
  .threshold-card.active-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--active-bg, transparent);
    pointer-events: none;
  }
  .threshold-card.full-width { grid-column: 1 / -1; }
  /* 再校準觸發成立時亮燈 */
  .threshold-card.recal-hot {
    border-color: var(--amber);
    background: var(--yellow-bg);
    animation: pulse-amber 1.6s ease-in-out infinite;
  }
  .threshold-card.recal-hot .tc-label,
  .threshold-card.recal-hot .tc-formula,
  .threshold-card.recal-hot .tc-buffer { color: var(--amber); }
  .tc-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .tc-value {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    line-height: 1;
  }
  .tc-formula {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .tc-buffer {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  /* ── RECAL ALERT ── */
  .recal-alert {
    margin: 0 16px 8px;
    background: #1a0f00;
    border: 1px solid var(--amber-dim);
    border-left: 3px solid var(--amber);
    border-radius: 6px;
    padding: 10px 12px;
    display: none;
  }
  .recal-alert.visible { display: flex; align-items: center; gap: 10px; }
  .recal-icon { font-size: 16px; flex-shrink: 0; }
  .recal-text {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--amber);
    line-height: 1.5;
  }
  .recal-apply-btn {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--bg);
    background: var(--amber);
    border: none;
    border-radius: 4px;
    padding: 5px 10px;
    cursor: pointer;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  /* ── BASELINE PANEL ── */
  .baseline-panel {
    margin: 0 16px 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .panel-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .baseline-value {
    font-family: var(--mono);
    font-size: 29px;
    font-weight: 700;
    color: var(--text-hi);
  }
  .baseline-meta {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .baseline-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .action-btn {
    flex: 1;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 6px;
    padding: 8px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .action-btn:active { background: var(--border); color: var(--text-hi); }
  .action-btn.primary {
    background: var(--amber);
    color: var(--bg);
    border-color: var(--amber);
    font-weight: 600;
  }
  .action-btn.primary:active { opacity: 0.85; }

  /* ── MANUAL BASELINE EDIT ── */
  .edit-panel {
    margin: 0 16px 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-hi);
    border-radius: 10px;
    padding: 14px;
    display: none;
  }
  .edit-panel.visible { display: block; }
  .edit-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: end;
  }
  .edit-field { display: flex; flex-direction: column; gap: 5px; }
  .edit-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .edit-input {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--text-hi);
    background: var(--bg-input);
    border: 1px solid var(--border-hi);
    border-radius: 6px;
    padding: 9px 10px;
    outline: none;
    width: 100%;
  }
  .edit-input:focus { border-color: var(--amber-dim); }
  .note-input {
    font-family: var(--sans);
    font-size: 15px;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    outline: none;
    width: 100%;
    margin-top: 8px;
  }
  .note-input::placeholder { color: var(--text-dim); }
  .save-btn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--bg);
    background: var(--amber);
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    cursor: pointer;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .cancel-btn {
    display: block;
    text-align: center;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    padding: 8px;
    cursor: pointer;
    margin-top: 4px;
  }

  /* ── BASELINE CHART + 校準歷史（同一區塊）── */
  .chart-section {
    margin: 0 16px 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px 6px;
  }
  .drift-divider {
    border-top: 1px solid var(--border);
    margin: 8px -14px 0;
  }
  .section-header.nested {
    border-top: none;
    padding: 10px 0 4px;
  }
  .header-btns { display: flex; gap: 4px; }
  .header-btns .clear-btn { padding: 4px 6px; }
  /* 巢狀於 chart-section 內時，去掉自己的卡片外框 */
  .chart-section .year-group { margin-bottom: 6px; }
  .chart-section .year-header {
    background: none;
    border: none;
    border-radius: 0;
    padding: 6px 0 2px;
  }
  .chart-section .year-label { font-size: 16px; }
  .chart-section .ytd-pct { font-size: 15px; }
  .chart-section .timeline {
    background: none;
    border: none;
    border-radius: 0;
    padding: 0;
  }
  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .chart-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .chart-legend {
    display: flex;
    gap: 10px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }
  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 2px solid currentColor;
    flex-shrink: 0;
  }

  /* ── BUTTON RULE2 STATE ── */
  .action-btn.btn-rule2 {
    animation: pulse-amber 1.6s ease-in-out infinite;
  }
  @keyframes pulse-amber {
    0%,100% { box-shadow: 0 0 0 0 rgba(240,165,0,0.5); }
    50%      { box-shadow: 0 0 0 7px rgba(240,165,0,0); }
  }
  html.light .action-btn.btn-rule2 {
    animation: pulse-amber-light 1.6s ease-in-out infinite;
  }
  @keyframes pulse-amber-light {
    0%,100% { box-shadow: 0 0 0 0 rgba(160,98,0,0.4); }
    50%      { box-shadow: 0 0 0 7px rgba(160,98,0,0); }
  }

  /* ── RULE CHECK ── */
  .rule-section {
    margin: 0 16px 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px 14px;
  }
  .rule-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .rule-verdict {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid currentColor;
    text-transform: uppercase;
  }
  .verdict-hold   { color: var(--text-dim); }
  .verdict-update { color: var(--amber); background: var(--yellow-bg); }
  .rule-row {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 0 8px;
    padding: 8px 0;
    align-items: start;
  }
  .rule-row:not(:last-child) { border-bottom: 1px solid var(--border); }
  .rule-tag {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 2px 0;
    text-align: center;
    border-radius: 3px;
    border: 1px solid currentColor;
    line-height: 1.4;
  }
  .rule-name {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text-hi);
    line-height: 1.35;
  }
  .rule-cond {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    line-height: 1.5;
    word-break: break-all;
  }
  .rule-state {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    padding-top: 2px;
  }
  .rs-pass  { color: var(--green); }
  .rs-fail  { color: var(--text-dim); }
  .rs-guard { color: var(--purple); }
  .rule-summary {
    margin-top: 10px;
    padding: 10px 11px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .rule-summary b { color: var(--text-hi); font-weight: 700; }
  .rule-toggle {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 0 0;
    text-transform: uppercase;
  }
  .rule-math {
    display: none;
    margin-top: 8px;
    padding: 10px 11px;
    background: var(--bg-input);
    border: 1px dashed var(--border-hi);
    border-radius: 7px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.8;
    white-space: pre;
    overflow-x: auto;
  }
  .rule-math.visible { display: block; }
  .collapsible { display: none; }
  .collapsible.visible { display: block; }

  /* ── SNAPSHOT LOG ── */
  .snap-list { margin-top: 4px; }
  .snap-item {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 0 10px;
    align-items: center;
    padding: 9px 0;
    font-family: var(--mono);
    font-size: 13px;
  }
  .snap-item:not(:last-child) { border-bottom: 1px solid var(--border); }
  .snap-date  { color: var(--text-dim); font-size: 12px; }
  .high-star  { color: var(--amber); font-size: 11px; }
  .snap-price { color: var(--text-hi); font-weight: 600; }
  .snap-zone  { font-size: 11px; letter-spacing: 0.06em; }
  .row-del {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
  }

  /* ── RULE3 OVERRIDE ── */
  .override-box {
    display: none;
    margin-top: 8px;
    padding: 9px 10px;
    background: var(--red-bg);
    border: 1px solid var(--red);
    border-radius: 6px;
  }
  .override-box.visible { display: block; }
  .override-box.warn {
    background: var(--yellow-bg);
    border-color: var(--amber);
  }
  .override-box.warn .override-label { color: var(--amber); }
  .override-label {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--red);
    line-height: 1.45;
    cursor: pointer;
  }
  .override-label input { margin-top: 3px; flex-shrink: 0; }

  /* ── TOAST / UNDO ── */
  .toast {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(58px + env(safe-area-inset-bottom));
    background: var(--bg-card);
    border: 1px solid var(--border-hi);
    border-left: 3px solid var(--amber);
    border-radius: 8px;
    padding: 11px 12px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 200;
    box-shadow: 0 6px 24px rgba(0,0,0,0.45);
  }
  .toast.visible { display: flex; }
  .toast-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
    flex: 1;
  }
  .toast-undo {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--bg);
    background: var(--amber);
    border: none;
    border-radius: 5px;
    padding: 7px 12px;
    cursor: pointer;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* ── DISABLED PRIMARY ── */
  .action-btn.locked {
    background: var(--bg-input);
    color: var(--text-dim);
    border-color: var(--border);
    font-weight: 400;
    cursor: not-allowed;
  }

  /* ── HISTORY ── */
  .history-section {
    padding: 0 16px 16px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0 10px;
    border-top: 1px solid var(--border);

  .clear-btn {

    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    padding: 4px 0;

  /* ── YEAR GROUP ── */
  .year-group { margin-bottom: 20px; }
  .year-header {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px 10px 0 0;
    padding: 12px 14px;

    align-items: center;

    font-family: var(--mono);
    font-size: 20px;

  .year-ytd {
    text-align: right;

  .ytd-pct {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;

  .ytd-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;

  /* ── TIMELINE ── */
  .timeline {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 0 0 10px 10px;
    padding: 4px 14px 6px;
    position: relative;

  .tl-item {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 0 10px;
    align-items: start;
    padding: 10px 0;

  .tl-item:not(:last-child) { border-bottom: 1px solid var(--border); }
  .tl-dot-col {
    display: flex;
    flex-direction: column;
    align-items: center;

    width: 10px;
    height: 10px;

    color: var(--text-dim);

    margin-bottom: 3px;

    font-family: var(--sans);

  .tl-baseline {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--amber);

    grid-row: 1 / 3;
    grid-column: 3;

  .type-annual  { background: #0e1a2e; color: #4d9fff; border: 1px solid #1a3050; }
  .type-rule2   { background: #1a0f00; color: var(--amber); border: 1px solid var(--amber-dim); }
  .type-manual  { background: #0f100a; color: #6db33f; border: 1px solid #2a3a1a; }
  .empty-history {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    padding: 20px 0;
    letter-spacing: 0.08em;

  /* ── STATUS BAR ── */
  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));

  .status-text {
    font-family: var(--mono);

  }
  .status-dot {
    width: 6px;

  }
  .status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── SPACER for fixed bottom bar ── */

  /* ── ZONE COLOR MAPPING ── */
  .zone-normal  { color: var(--green); }
  .zone-warning { color: var(--yellow); }
  .zone-danger  { color: var(--red); }

  .bg-normal  { --active-color: var(--green); --active-bg: rgba(0,201,110,0.05); }

  /* ── DESKTOP: 固定寬度單欄，維持手機版比例 ── */

  @media (min-width: 600px) {

    .status-bar {

</style>

<script>
// ── STATE ──────────────────────────────────────────
// v3: v2 had an off-spec manual baseline write (2026-07-17). Bumping the key
// discards it on every device; the old key is also actively purged below.
const STORAGE_KEY  = 'baseline_calculator_v3';
const LEGACY_KEYS  = ['baseline_calculator', 'baseline_calculator_v2'];

// 2026 年度最高價：R2 觸發價 43.90 差 2.58 未達，因此基準不動（留存記錄，非校準）
const YEAR_HIGH_2026 = {
  date: '2026-07-17', price: 41.32, baseline: 32.52, zone: 'normal', high: true,
  note: '2026 年度最高價 · +27.1%，未達 R2 43.90（差 2.58），基準不動',
};

function canonicalState() {
  return {
    baseline: 32.52,
    baselineDate: '2026-05-12',
    baselineNote: 'Rule2 第二次35%上移（5/12高點確立）',
    history: [
      { date: '2026-01-01', baseline: 17.05, type: 'annual', note: 'Rule1 年度重設（375÷22 拆分還原）' },
      { date: '2026-03-??', baseline: 23.01, type: 'rule2',  note: 'Rule2 第一次35%上移' },
      { date: '2026-05-12', baseline: 32.52, type: 'rule2',  note: 'Rule2 第二次35%上移（確立當前基準）' },
    ],
    snapshots: [ { ...YEAR_HIGH_2026 } ]
  };
}

// 一次性補錄：不管裝置上目前存了什麼，都把年度最高價補回紀錄
function backfillYearHigh() {
  if (state.backfilledHigh2026) return;
  if (!state.snapshots.some(s => s.date === YEAR_HIGH_2026.date)) {
    state.snapshots.push({ ...YEAR_HIGH_2026 });
    state.snapshots.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  }
  state.backfilledHigh2026 = true;
}

// ── 年度最高價：獨立的 high-water mark，每次「確定的價格」自動比對更新 ──
// 存成 { '2026': {date, price} }，不依賴 Review 紀錄是否被刪，
// 也不依賴 canonicalState 的種子——所以新的一年會自己長出來。
function seedYearHighs() {
  if (!state.yearHighs || typeof state.yearHighs !== 'object') state.yearHighs = {};
  const y = YEAR_HIGH_2026.date.slice(0, 4);
  if (!state.yearHighs[y]) {
    state.yearHighs[y] = { date: YEAR_HIGH_2026.date, price: YEAR_HIGH_2026.price };
  }
  // 用既有 Review 紀錄回填每一年的高點（涵蓋手動補記的舊資料）
  (state.snapshots || []).forEach(s => {
    const yr = (s.date || '').slice(0, 4);
    if (!yr || !s.price) return;
    if (!state.yearHighs[yr] || s.price > state.yearHighs[yr].price) {
      state.yearHighs[yr] = { date: s.date, price: s.price };
    }
  });
}

// 只在「價格已確定」時呼叫（報價成功、輸入框 commit、記錄 Review、更新基準），
// 不綁 oninput，否則打字打到一半的 9 會被記成年度最高。
function trackYearHigh(price) {
  if (!price || isNaN(price) || price <= 0) return false;
  const yr = String(new Date().getFullYear());
  const cur = state.yearHighs[yr];
  if (cur && price <= cur.price) return false;
  state.yearHighs[yr] = { date: todayISO(), price };
  saveState();
  return true;
}

function yearHigh() {
  const yr = String(new Date().getFullYear());
  return state.yearHighs ? state.yearHighs[yr] || null : null;
}

let state = canonicalState();
let priceSource = 'manual';
let undoSnapshot = null;   // { baseline, baselineDate, baselineNote, historyLen }
let undoTimer = null;

function purgeLegacy() {
  LEGACY_KEYS.forEach(k => { try { localStorage.removeItem(k); } catch(e) {} });
}

function loadState() {
  purgeLegacy();
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch(e) {}
  if (!Array.isArray(state.snapshots)) state.snapshots = [];
  backfillYearHigh();
  seedYearHighs();
  saveState();   // 把種子與補錄結果落地，不再只是預設值
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function resetToCanonical() {
  if (!confirm('重置為官方基準 32.52（2026-05-12）？\n\n校準歷史會回到三筆原始紀錄，月度 Review 紀錄保留。')) return;
  const snaps = state.snapshots || [];
  state = canonicalState();
  state.snapshots = snaps;
  purgeLegacy();
  saveState();
  render();
}

// ── ZONE LOGIC ─────────────────────────────────────
function getZone(price, baseline) {
  const r = price / baseline;
  if (r >= 0.80) return 'normal';
  if (r >= 0.70) return 'warning';
  if (r >= 0.50) return 'danger';
  return 'crisis';
}

const ZONE_CONFIG = {
  normal:  { name: '正常區', color: 'var(--green)',  bg: 'var(--green-bg)',  action: 'Year1/2029+：買入1張\nYear2–3：季底才執行' },
  warning: { name: '警示區', color: 'var(--yellow)', bg: 'var(--yellow-bg)', action: '本月跳過\n現金累積→危機加碼' },
  danger:  { name: '危機區', color: 'var(--red)',    bg: 'var(--red-bg)',    action: '動用累積現金\n分批加碼' },
  crisis:  { name: '深度危機', color: 'var(--red)',  bg: 'var(--red-bg)',    action: '歷史級折扣\n確認橋接基金後持續買' },
};

function fmt(n) { return n.toFixed(2); }
function fmtPct(n) {
  const s = (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
  return s;
}
function bufferText(price, threshold, label) {
  if (!price) return '';
  const dist = ((price - threshold) / threshold * 100);
  const arrow = dist >= 0 ? '↑' : '↓';
  return `${arrow} ${Math.abs(dist).toFixed(1)}% ${dist >= 0 ? '以上' : '以下'}`;
}

// ── RULE ENGINE ────────────────────────────────────
// 判定式： (規則一 OR 規則二) AND 規則三
//   規則一 = 每年 1 月第一個交易日的年度重設
//   規則二 = 收盤 ≥ 基準 × 1.35 的 35% 上移
//   規則三 = 只升不降（守門，優先權最高）
const R2_MULT = 1.35;
const JAN_WINDOW_DAYS = 10;   // 1/1–1/10 視為「年度重設視窗」，避開交易日曆判斷

function todayISO() { return new Date().toISOString().split('T')[0]; }

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

function evaluateRules(price, baseline) {
  const now   = new Date();
  const year  = now.getFullYear();
  const inJan = now.getMonth() === 0 && now.getDate() <= JAN_WINDOW_DAYS;
  const doneThisYear = (state.history || []).some(
    h => h.type === 'annual' && (h.date || '').startsWith(String(year))
  );

  // 下一次年度視窗開啟日
  const nextJan = new Date(inJan ? year : year + 1, 0, 1);
  const daysToJan = Math.max(0, daysBetween(now, nextJan));

  const hasPrice = !!price && !isNaN(price) && price > 0;
  const trigger  = baseline * R2_MULT;

  // ── 規則一 ──
  const r1 = { tag: 'R1', name: '年度重設', pass: false };
  r1.cond = `每年 1 月第一個交易日（視窗 1/1–1/${JAN_WINDOW_DAYS}）`;
  if (!inJan) {
    r1.state = '未到期';
    r1.detail = `今天 ${todayISO()} 不在視窗內 · 距 ${nextJan.getFullYear()}-01-01 還有 ${daysToJan} 天`;
  } else if (doneThisYear) {
    r1.state = '已執行';
    r1.detail = `${year} 年度重設已完成，本年不再觸發`;
  } else if (!hasPrice) {
    r1.state = '待輸入';
    r1.detail = '視窗開啟中 · 請先輸入今日收盤';
  } else if (price <= baseline) {
    r1.state = '不成立';
    r1.detail = `收盤 ${fmt(price)} ≤ 基準 ${fmt(baseline)} → 規則三擋下，不更新（市場未恢復）`;
  } else {
    r1.pass = true;
    r1.state = '✓ 成立';
    r1.detail = `視窗開啟 · 收盤 ${fmt(price)} > 基準 ${fmt(baseline)} → 年度重設`;
  }

  // ── 規則二 ──
  const r2 = { tag: 'R2', name: '35% 上移', pass: false };
  r2.cond = `收盤 ≥ 基準 × ${R2_MULT} = ${fmt(trigger)}`;
  if (!hasPrice) {
    r2.state = '待輸入';
    r2.detail = `觸發價 ${fmt(trigger)} · 請先輸入今日收盤`;
  } else if (price >= trigger) {
    r2.pass = true;
    r2.state = '✓ 成立';
    r2.detail = `收盤 ${fmt(price)} ≥ ${fmt(trigger)} → 立即上移至 ${fmt(price)}`;
  } else {
    r2.state = '不成立';
    const gapPct = (trigger - price) / price * 100;
    r2.detail = `${fmt(price)} / ${fmt(trigger)} · 還差 ${fmt(trigger - price)}（需 +${gapPct.toFixed(1)}%）`;
  }

  // ── 規則三 ──（守門，不是觸發器）
  const r3 = { tag: 'R3', name: '只升不降', guard: true };
  r3.cond = '任何情況都不向下調整基準（優先權最高）';
  if (!hasPrice) {
    r3.state = '守門中';
    r3.detail = `現行基準 ${fmt(baseline)} 為下限`;
  } else if (price < baseline) {
    r3.state = '● 阻擋中';
    r3.detail = `若以今日 ${fmt(price)} 更新 → 低於 ${fmt(baseline)}，會被擋下`;
  } else {
    r3.state = '守門中';
    r3.detail = `今日 ${fmt(price)} ≥ ${fmt(baseline)}，方向不違規`;
  }

  const verdict = r1.pass ? 'rule1' : (r2.pass ? 'rule2' : 'hold');
  return { r1, r2, r3, verdict, trigger, hasPrice, inJan, daysToJan, doneThisYear };
}

// ── RENDER ─────────────────────────────────────────
function render() {
  const baseline = state.baseline;
  const normalFloor  = baseline * 0.80;
  const warningFloor = baseline * 0.70;
  const dangerFloor  = baseline * 0.50;
  const recalTrigger = baseline * 1.35;

  // Baseline panel
  document.getElementById('baselineDisplay').textContent = fmt(baseline);
  document.getElementById('baselineMeta').textContent =
    state.baselineDate + (state.baselineNote ? ' · ' + state.baselineNote : '');

  // Thresholds
  document.getElementById('tvBaseline').textContent = fmt(baseline);
  document.getElementById('tfBaseline').textContent = state.baselineDate;
  document.getElementById('tvNormal').textContent   = fmt(normalFloor);
  document.getElementById('tvWarning').textContent  = fmt(warningFloor);
  document.getElementById('tvDanger').textContent   = fmt(dangerFloor);
  document.getElementById('tvRecal').textContent    = fmt(recalTrigger);

  const priceStr = document.getElementById('priceInput').value;
  const price = parseFloat(priceStr);

  if (isNaN(price) || price <= 0) {
    // No price
    document.getElementById('pricePct').textContent = '—';
    document.getElementById('pricePct').className = 'price-pct';
    document.getElementById('zoneDot').style.background = 'var(--text-dim)';
    document.getElementById('zoneDot').style.color = 'var(--text-dim)';
    document.getElementById('zoneName').textContent = '— 請輸入價格 —';
    document.getElementById('zoneName').className = 'zone-name';
    document.getElementById('zoneAction').textContent = '';
    document.getElementById('recalAlert').classList.remove('visible');
    document.getElementById('cardRecal').classList.remove('recal-hot');
    ['cardNormal','cardWarning','cardDanger'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('active-zone','bg-normal','bg-warning','bg-danger');
    });
    ['tbNormal','tbWarning','tbDanger','tbRecal'].forEach(id =>
      document.getElementById(id).textContent = '');
    renderHistory();
    renderSnapshots();
    renderChart();
    renderRuleCheck(null);
    updateBaselineBtn(null);
    return;
  }

  // Pct vs baseline
  const pct = (price - baseline) / baseline * 100;
  const pctEl = document.getElementById('pricePct');
  pctEl.textContent = fmtPct(pct);
  pctEl.className = 'price-pct ' + (pct >= 0 ? 'zone-normal' : (pct < -20 ? 'zone-warning' : ''));

  // Zone
  const zone = getZone(price, baseline);
  const zc = ZONE_CONFIG[zone];
  const dot = document.getElementById('zoneDot');
  dot.style.background = zc.color;
  dot.style.color = zc.color;
  const nameEl = document.getElementById('zoneName');
  nameEl.textContent = zc.name;
  nameEl.className = 'zone-name zone-' + zone;
  document.getElementById('zoneAction').textContent = zc.action;

  // Card highlights
  const cardMap = { normal: 'cardNormal', warning: 'cardWarning', danger: 'cardDanger', crisis: 'cardDanger' };
  const bgMap   = { normal: 'bg-normal',  warning: 'bg-warning',  danger: 'bg-danger',  crisis: 'bg-danger' };
  ['cardNormal','cardWarning','cardDanger'].forEach(id => {
    document.getElementById(id).classList.remove('active-zone','bg-normal','bg-warning','bg-danger');
  });
  if (cardMap[zone]) {
    document.getElementById(cardMap[zone]).classList.add('active-zone', bgMap[zone]);
  }

  // Buffer texts
  document.getElementById('tbNormal').textContent  = bufferText(price, normalFloor, '正常區');
  document.getElementById('tbWarning').textContent = bufferText(price, warningFloor, '警示區');
  document.getElementById('tbDanger').textContent  = bufferText(price, dangerFloor, '危機區');

  const toRecal = recalTrigger - price;
  document.getElementById('tbRecal').textContent = toRecal > 0
    ? `還差 ${toRecal.toFixed(2)} 觸發`
    : '⚡ 觸發條件成立';

  // Recal alert + 觸發卡亮燈
  const recalHot = price >= recalTrigger;
  document.getElementById('cardRecal').classList.toggle('recal-hot', recalHot);
  if (recalHot) {
    document.getElementById('recalText').textContent =
      `收盤 ${fmt(price)} ≥ ${fmt(recalTrigger)}（基準×1.35）\nRule 2 觸發，建議更新基準線`;
    document.getElementById('recalAlert').classList.add('visible');
  } else {
    document.getElementById('recalAlert').classList.remove('visible');
  }

  renderHistory();
  renderSnapshots();
  renderChart();
  renderRuleCheck(price);
  updateBaselineBtn(price);
}

// ── RULE CHECK RENDER ──────────────────────────────
function renderRuleCheck(price) {
  const baseline = state.baseline;
  const ev = evaluateRules(price, baseline);

  const stateClass = s =>
    s.startsWith('✓') ? 'rs-pass' : (s.startsWith('●') ? 'rs-guard' : 'rs-fail');
  const tagColor = { R1: 'var(--green)', R2: 'var(--amber)', R3: 'var(--purple)' };

  document.getElementById('ruleList').innerHTML = [ev.r1, ev.r2, ev.r3].map(r => `
    <div class="rule-row">
      <div class="rule-tag" style="color:${tagColor[r.tag]}">${r.tag}</div>
      <div>
        <div class="rule-name">${r.name}</div>
        <div class="rule-cond">${r.cond}<br>${r.detail}</div>
      </div>
      <div class="rule-state ${stateClass(r.state)}">${r.state}</div>
    </div>`).join('');

  const badge = document.getElementById('ruleVerdict');
  const zone  = ev.hasPrice ? ZONE_CONFIG[getZone(price, baseline)].name : null;

  if (ev.verdict === 'hold') {
    badge.textContent = '維持基準';
    badge.className = 'rule-verdict verdict-hold';
    document.getElementById('ruleSummary').innerHTML =
      `(R1 ✗ <b>OR</b> R2 ✗) <b>AND</b> R3 → <b>不更新</b>\n` +
      `基準維持 <b>${fmt(baseline)}</b>（${state.baselineDate}）\n` +
      (ev.hasPrice
        ? `今日動作：<b>${zone}</b> → ${ZONE_CONFIG[getZone(price, baseline)].action.replace(/\n/g, ' / ')}`
        : `今日動作：請先輸入或取得收盤價`);
  } else {
    const label = ev.verdict === 'rule1' ? 'R1 年度重設' : 'R2 35% 上移';
    badge.textContent = '可更新';
    badge.className = 'rule-verdict verdict-update';
    document.getElementById('ruleSummary').innerHTML =
      `(${ev.verdict === 'rule1' ? 'R1 ✓' : 'R1 ✗'} <b>OR</b> ${ev.verdict === 'rule2' ? 'R2 ✓' : 'R2 ✗'}) <b>AND</b> R3 ✓ → <b>更新</b>\n` +
      `依據 <b>${label}</b>：${fmt(baseline)} → <b>${fmt(price)}</b>\n` +
      `更新後：正常 ${fmt(price * 0.80)} / 警示 ${fmt(price * 0.70)} / 危機 ${fmt(price * 0.50)} / 再校準 ${fmt(price * R2_MULT)}`;
  }

  // 計算式
  const lines = [
    `基準  ${fmt(baseline)}   ${state.baselineDate}`,
    `  × 0.80 = ${fmt(baseline * 0.80)}   正常區下緣`,
    `  × 0.70 = ${fmt(baseline * 0.70)}   警示區下緣`,
    `  × 0.50 = ${fmt(baseline * 0.50)}   危機區下緣`,
    `  × 1.35 = ${fmt(baseline * R2_MULT)}   再校準觸發`,
  ];
  if (ev.hasPrice) {
    const ratio = price / baseline;
    lines.push(
      ``,
      `今日  ${fmt(price)}`,
      `  ${fmt(price)} ÷ ${fmt(baseline)} = ${ratio.toFixed(4)}`,
      `  (${fmt(price)} − ${fmt(baseline)}) ÷ ${fmt(baseline)}`,
      `        = ${fmtPct((price - baseline) / baseline * 100)}`,
      `  → ${ZONE_CONFIG[getZone(price, baseline)].name}（門檻 ${
        ratio >= 0.80 ? '≥ 0.80' : ratio >= 0.70 ? '0.70–0.80' : ratio >= 0.50 ? '0.50–0.70' : '< 0.50'
      }）`
    );
  }
  const yh = yearHigh();
  if (yh) {
    lines.push(
      ``,
      `${yh.date.slice(0, 4)} 年度最高  ${fmt(yh.price)}   ${yh.date.slice(5)}`,
      yh.price >= baseline * R2_MULT
        ? `  已達 R2 觸發價 ${fmt(baseline * R2_MULT)}`
        : `  距 R2 觸發價 ${fmt(baseline * R2_MULT)} 差 ${fmt(baseline * R2_MULT - yh.price)} → 基準不動`
    );
  }
  lines.push(
    ``,
    `下次校準機會`,
    `  R1  ${new Date(new Date().getMonth() === 0 && new Date().getDate() <= JAN_WINDOW_DAYS
        ? new Date().getFullYear() : new Date().getFullYear() + 1, 0, 1)
        .toISOString().split('T')[0]}   還有 ${ev.daysToJan} 天`,
    `  R2  ${fmt(ev.trigger)}${ev.hasPrice ? `   需 +${((ev.trigger - price) / price * 100).toFixed(1)}%` : ''}`
  );
  document.getElementById('ruleMath').textContent = lines.join('\n');
}

function toggleMath() {
  const el = document.getElementById('ruleMath');
  const on = el.classList.toggle('visible');
  document.getElementById('mathToggle').textContent = on ? '▾ 隱藏計算式' : '▸ 顯示計算式';
}

// ── HISTORY ────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('historyList');
  const hist = state.history || [];
  const countEl = document.getElementById('histCount');
  if (countEl) countEl.textContent = hist.length;
  const sumEl = document.getElementById('histSummary');
  if (sumEl) {
    sumEl.textContent = hist.length
      ? `${fmt(hist[0].baseline)} → ${fmt(hist[hist.length - 1].baseline)} · ${hist.length} 次校準`
      : '尚無校準紀錄';
  }
  if (hist.length === 0) {
    list.innerHTML = '<div class="empty-history">尚無校準紀錄</div>';
    return;
  }
  // Group by year
  const byYear = {};
  state.history.forEach(h => {
    const yr = (h.date || '').slice(0, 4) || '—';
    if (!byYear[yr]) byYear[yr] = [];
    byYear[yr].push(h);
  });

  const typeClass = { annual: 'type-annual', rule2: 'type-rule2', manual: 'type-manual' };
  const typeLabel = { annual: 'Rule 1', rule2: 'Rule 2', manual: '手動' };
  const dotColor  = { annual: 'var(--green)', rule2: 'var(--amber)', manual: 'var(--text-dim)' };

  const years = Object.keys(byYear).sort().reverse();

  list.innerHTML = years.map(yr => {
    const entries = byYear[yr]; // chronological
    // 起點優先取「該年之前最後一筆基準」（跨年結轉），沒有才退回當年第一筆，
    // 否則一年只有一次校準時 YTD 會恆為 0%
    const carryIn = [...state.history]
      .filter(h => (h.date || '') < `${yr}-01-01`)
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
      .slice(-1)[0];
    const startBaseline = carryIn ? carryIn.baseline : entries[0].baseline;
    const endBaseline   = entries[entries.length - 1].baseline;
    const ytdPct = ((endBaseline - startBaseline) / startBaseline * 100);
    const ytdColor = ytdPct >= 0 ? 'var(--green)' : 'var(--red)';

    const timelineItems = [...entries].reverse().map((h, i, arr) => {
      const tc = typeClass[h.type] || 'type-manual';
      const tl = typeLabel[h.type] || '手動';
      const dc = dotColor[h.type]  || 'var(--text-dim)';
      return `
        <div class="tl-item">
          <div class="tl-dot-col">
            <div class="tl-dot" style="color:${dc}"></div>
          </div>
          <div class="tl-content">
            <div class="tl-date">
              ${h.date}
              <span class="history-type ${tc}">${tl}</span>
              <button class="row-del" onclick="deleteHistoryEntry(${state.history.indexOf(h)})" title="刪除這筆">×</button>
            </div>
            <div class="tl-note">${h.note || ''}</div>
          </div>
          <div class="tl-baseline">${fmt(h.baseline)}</div>
        </div>`;
    }).join('');

    return `
      <div class="year-group">
        <div class="year-header">
          <div class="year-label">${yr}</div>
          <div class="year-ytd">
            <div class="ytd-pct" style="color:${ytdColor}">${ytdPct >= 0 ? '+' : ''}${ytdPct.toFixed(1)}%</div>
            <div class="ytd-label">基準 YTD</div>
          </div>
        </div>
        <div class="timeline">${timelineItems}</div>
      </div>`;
  }).join('');
}

  state.history = [];

}

function applyCurrentAsBaseline() {
  const price = parseFloat(document.getElementById('priceInput').value);
  if (isNaN(price) || price <= 0) { alert('請先輸入今日收盤價'); return; }

  const ev = evaluateRules(price, state.baseline);
  if (ev.verdict === 'hold') {
    alert(
      `規則未成立，不更新基準。\n\n` +
      `R1 年度重設：${ev.r1.state}\n${ev.r1.detail}\n\n` +
      `R2 35% 上移：${ev.r2.state}\n${ev.r2.detail}\n\n` +
      `若真的要覆寫，請走「手動更新基準」。`
    );
    return;
  }

  const type = ev.verdict;   // 'rule1' | 'rule2'
  const note = type === 'rule2'
    ? `Rule2 35%上移（${fmt(state.baseline)}→${fmt(price)}）`
    : `Rule1 年度重設（${fmt(state.baseline)}→${fmt(price)}）`;

  if (!confirm(`${note}\n\n更新後區間：\n正常 ${fmt(price*0.80)} / 警示 ${fmt(price*0.70)} / 危機 ${fmt(price*0.50)}\n再校準 ${fmt(price*R2_MULT)}\n\n確定更新？`)) return;

  captureUndo();
  const from  = state.baseline;
  const today = todayISO();
  addHistoryEntry(today, price, type === 'rule1' ? 'annual' : 'rule2', note);
  state.baseline = price;
  state.baselineDate = today;
  state.baselineNote = note;
  saveState();
  render();
  showUndoToast(from, price);
}

// 手動輸入分類：三條路徑對稱檢查（向下＝規則三、向上＝是否符合 R1/R2）
function classifyManual(val) {
  const b = state.baseline;
  if (isNaN(val) || val <= 0) return { kind: 'invalid' };
  if (val === b)              return { kind: 'same' };

  if (val < b) {
    return {
      kind: 'lower',
      warnClass: false,
      text: `${fmt(val)} < 現行基準 ${fmt(b)}，違反規則三（只升不降）。` +
            `僅限拆分還原／撤銷誤觸等資料修正時勾選，並務必填寫備註。`,
      confirmPrefix: '⚠ 向下覆寫（規則三例外）\n\n',
      noteLabel: '向下覆寫',
    };
  }

  const ev = evaluateRules(val, b);
  if (ev.verdict !== 'hold') {
    return {
      kind: 'legit',
      label: ev.verdict === 'rule2' ? 'Rule2 35%上移' : 'Rule1 年度重設',
      type:  ev.verdict === 'rule2' ? 'rule2' : 'annual',
    };
  }

  return {
    kind: 'offspec',
    warnClass: true,
    text: `${fmt(val)} 不符合 R1／R2。R2 需 ≥ ${fmt(ev.trigger)}（還差 ${fmt(ev.trigger - val)}）` +
          `· R1 ${ev.inJan ? '視窗開啟但條件未滿足' : `視窗未開（還有 ${ev.daysToJan} 天）`}。` +
          `此筆會記為「手動覆寫」，不是合法校準。`,
    confirmPrefix: '⚠ 不符合規則的手動覆寫\n\n',
    noteLabel: '違規覆寫',
  };
}

function checkOverrideNeeded() {
  const val = parseFloat(document.getElementById('newBaselineInput').value);
  const box = document.getElementById('overrideBox');
  const c   = classifyManual(val);
  const need = c.kind === 'lower' || c.kind === 'offspec';

  box.classList.toggle('visible', need);
  box.classList.toggle('warn', need && !!c.warnClass);
  if (need) {
    document.getElementById('overrideText').textContent = c.text;
  } else {
    document.getElementById('overrideCheck').checked = false;
  }
}

function saveManualBaseline() {
  const val = parseFloat(document.getElementById('newBaselineInput').value);
  if (isNaN(val) || val <= 0) { alert('請輸入有效數值'); return; }

  const c = classifyManual(val);
  if (c.kind === 'same') { alert('與現行基準相同，無需更新。'); return; }

  const needsOverride = c.kind === 'lower' || c.kind === 'offspec';
  if (needsOverride) {
    if (!document.getElementById('overrideCheck').checked) {
      alert(`${c.kind === 'lower' ? '規則三：基準只升不降。' : '此數值不符合 R1／R2。'}\n\n${c.text}`);
      checkOverrideNeeded();
      return;
    }
    if (!document.getElementById('noteInput').value.trim()) {
      alert(`${c.noteLabel}必須填寫備註（說明為何是例外）。`);
      return;
    }
  }

  const note  = document.getElementById('noteInput').value.trim()
                || (c.kind === 'legit' ? `${c.label}（${fmt(state.baseline)}→${fmt(val)}）` : '手動更新');
  const today = todayISO();
  if (!confirm(`${c.confirmPrefix || ''}基準 ${fmt(state.baseline)} → ${fmt(val)}\n備註：${note}\n\n確定？`)) return;

  captureUndo();
  const from = state.baseline;
  addHistoryEntry(today, val, c.type || 'manual', note);
  state.baseline = val;
  state.baselineDate = today;
  state.baselineNote = note;
  saveState();
  document.getElementById('editPanel').classList.remove('visible');
  document.getElementById('noteInput').value = '';
  document.getElementById('overrideCheck').checked = false;
  render();
  showUndoToast(from, val);
}

function addHistoryEntry(date, baseline, type, note) {
  if (!state.history) state.history = [];
  state.history.push({ date, baseline, type, note });
  saveState();
}

// ── PRICE FETCH ────────────────────────────────────
async function fetchPrice() {
  const btn = document.getElementById('fetchBtn');
  btn.textContent = '載入中…';
  btn.classList.add('loading');
  setStatus('取得報價中…', false);

  // Try via CORS proxy worker (server-side Yahoo Finance fetch)
  const PROXY = 'https://yahoo-proxy.yahooproxy.workers.dev/price?symbol=00631L.TW';
  try {
    const res = await fetch(PROXY, { signal: AbortSignal.timeout(8000) });
    if (res.ok) {
      const { price, ts } = await res.json();
      if (price) {
        document.getElementById('priceInput').value = price.toFixed(2);
        priceSource = 'live';
        trackYearHigh(price);
        const timeStr = ts
          ? new Date(ts * 1000).toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'})
          : '';
        setStatus(`即時報價 ${timeStr ? timeStr + ' · ' : ''}Yahoo Finance`, true);
        btn.textContent = '↻ 取得報價';
        btn.classList.remove('loading');
        render();
        return;
      }
    }
  } catch(e) {}

  // Fallback message
  btn.textContent = '↻ 取得報價';
  btn.classList.remove('loading');
  setStatus('無法取得報價，請手動輸入', false);
}

function setStatus(text, live) {
  document.getElementById('statusText').textContent = text;
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (live ? ' live' : '');
}

// ── BASELINE CHART ─────────────────────────────────
function renderChart() {
  const svg = document.getElementById('baselineChart');
  if (!svg || !state.history || state.history.length === 0) return;

  const W = 360, H = 130;
  const padL = 40, padR = 16, padT = 18, padB = 28;
  const cW = W - padL - padR;
  const cH = H - padT - padB;

  const entries = [...state.history].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const baseline = state.baseline;
  const currentPrice = parseFloat(document.getElementById('priceInput').value) || null;

  const yhEntry = yearHigh();
  const allV = entries.map(e => e.baseline)
    .concat(currentPrice ? [currentPrice] : [])
    .concat(yhEntry ? [yhEntry.price] : []);
  const minV = Math.min(...allV, baseline * 0.43);
  const maxV = Math.max(...allV, baseline * 1.42);

  const toY = v => padT + cH - ((v - minV) / (maxV - minV)) * cH;
  // 年度高點吃一個獨立的 x 槽（日期在最後一次校準之後、今日之前）
  const hasHigh = !!yhEntry;
  const totalSlots = entries.length + (hasHigh ? 1 : 0) + (currentPrice ? 1 : 0);
  const slotW = cW / (totalSlots + 0.4);
  const toX = i => padL + slotW * (i + 0.7);
  const xHigh = hasHigh ? toX(entries.length) : null;
  const xNow = toX(entries.length + (hasHigh ? 1 : 0));

  const isLight = document.documentElement.classList.contains('light');
  const C = {
    amber:   isLight ? '#a06200' : '#f0a500',
    green:   isLight ? '#006838' : '#00c96e',
    yellow:  isLight ? '#6e5000' : '#f5c518',
    red:     isLight ? '#b81c1c' : '#ff4545',
    dim:     isLight ? '#888a98' : '#4a4d5c',
    border:  isLight ? '#d6d0c4' : '#2e3040',
    bg:      isLight ? '#ffffff' : '#0e0f12',
    textdim: isLight ? '#888a98' : '#4a4d5c',
    bandY:   isLight ? 'rgba(245,197,24,0.12)' : 'rgba(245,197,24,0.07)',
    bandR:   isLight ? 'rgba(184,28,28,0.08)'  : 'rgba(255,69,69,0.06)',
    purple:  isLight ? '#5030b8' : '#9d7eff',
    cyan:    isLight ? '#0e6f78' : '#3ad6e0',   // 年度高：跟琥珀基準線區隔
  };
  const dotC = { annual: C.green, rule2: C.amber, manual: C.dim };

  const y_base = toY(baseline);
  const y_norm = toY(baseline * 0.80);
  const y_warn = toY(baseline * 0.70);
  const y_cris = toY(baseline * 0.50);

  let h = '';

  // Zone bands
  h += `<rect x="${padL}" y="${y_norm}" width="${cW}" height="${Math.max(0, y_warn - y_norm)}" fill="${C.bandY}"/>`;
  h += `<rect x="${padL}" y="${y_warn}" width="${cW}" height="${Math.max(0, y_cris - y_warn)}" fill="${C.bandR}"/>`;

  // Reference lines
  const refLines = [
    { y: y_base, color: C.amber,  label: fmt(baseline),        dash: '5 3' },
    { y: y_norm, color: C.green,  label: fmt(baseline * 0.80), dash: '3 3' },
    { y: y_warn, color: C.yellow, label: fmt(baseline * 0.70), dash: '3 3' },
  ];
  refLines.forEach(({ y, color, label, dash }) => {
    h += `<line x1="${padL}" y1="${y}" x2="${padL + cW}" y2="${y}" stroke="${color}" stroke-width="1" stroke-dasharray="${dash}" opacity="0.55"/>`;
    h += `<text x="${padL - 3}" y="${y + 4}" text-anchor="end" font-size="8" fill="${color}" font-family="JetBrains Mono,monospace">${label}</text>`;
  });

  // B3 recalibration trigger line (next target)
  const y_recal = toY(baseline * 1.35);
  h += `<line x1="${padL}" y1="${y_recal}" x2="${padL + cW}" y2="${y_recal}" stroke="${C.purple}" stroke-width="1" stroke-dasharray="2 4" opacity="0.75"/>`;
  h += `<text x="${padL - 3}" y="${y_recal + 4}" text-anchor="end" font-size="8" fill="${C.purple}" font-family="JetBrains Mono,monospace">${fmt(baseline * 1.35)}</text>`;
  h += `<text x="${padL + cW - 2}" y="${y_recal - 4}" text-anchor="end" font-size="8" fill="${C.purple}" font-family="JetBrains Mono,monospace" opacity="0.9">→ B3</text>`;

  // Connecting path between calibration points
  if (entries.length > 1) {
    const pts = entries.map((e, i) => `${toX(i)},${toY(e.baseline)}`).join(' ');
    h += `<polyline points="${pts}" fill="none" stroke="${C.amber}" stroke-width="1.5" opacity="0.35" stroke-linejoin="round"/>`;
  }

  // Calibration dots + labels
  entries.forEach((e, i) => {
    const x = toX(i);
    const y = toY(e.baseline);
    const dc = dotC[e.type] || C.dim;
    const dateShort = (e.date || '').replace(/^\d{4}-/, '').replace(/-\?\?$/, '').replace('??', '?');
    h += `<circle cx="${x}" cy="${y}" r="5" fill="${C.bg}" stroke="${dc}" stroke-width="2"/>`;
    h += `<text x="${x}" y="${y - 10}" text-anchor="middle" font-size="9" fill="${dc}" font-family="JetBrains Mono,monospace" font-weight="600">${fmt(e.baseline)}</text>`;
    h += `<text x="${x}" y="${H - padB + 14}" text-anchor="middle" font-size="8" fill="${C.textdim}" font-family="JetBrains Mono,monospace">${dateShort}</text>`;
  });

  // 年度高點：只畫 data point（虛線圈），不畫貫穿的水平線
  if (hasHigh) {
    const yH = toY(yhEntry.price);
    if (entries.length > 0) {
      const lx = toX(entries.length - 1), ly = toY(entries[entries.length - 1].baseline);
      h += `<line x1="${lx}" y1="${ly}" x2="${xHigh}" y2="${yH}" stroke="${C.border}" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>`;
    }
    h += `<circle cx="${xHigh}" cy="${yH}" r="5" fill="${C.bg}" stroke="${C.cyan}" stroke-width="1.6" stroke-dasharray="2.2 2"/>`;
    h += `<text x="${xHigh}" y="${yH - 10}" text-anchor="middle" font-size="9" fill="${C.cyan}" font-family="JetBrains Mono,monospace" font-weight="600">${fmt(yhEntry.price)}</text>`;
    h += `<text x="${xHigh}" y="${H - padB + 14}" text-anchor="middle" font-size="8" fill="${C.cyan}" font-family="JetBrains Mono,monospace">★${yhEntry.date.slice(5)}</text>`;
  }

  // Current price marker
  if (currentPrice) {
    const zone = getZone(currentPrice, baseline);
    const pc = { normal: C.green, warning: C.yellow, danger: C.red, crisis: C.red }[zone];
    const yP = toY(currentPrice);
    // Dashed connector：優先接年度高點，其次接最後一次校準
    const prevX = hasHigh ? xHigh : (entries.length ? toX(entries.length - 1) : null);
    const prevY = hasHigh ? toY(yhEntry.price) : (entries.length ? toY(entries[entries.length - 1].baseline) : null);
    if (prevX !== null) {
      h += `<line x1="${prevX}" y1="${prevY}" x2="${xNow}" y2="${yP}" stroke="${C.border}" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>`;
    }
    // Triangle marker (pointing down)
    h += `<path d="M${xNow},${yP} L${xNow - 5},${yP - 10} L${xNow + 5},${yP - 10} Z" fill="${pc}" opacity="0.9"/>`;
    h += `<text x="${xNow}" y="${yP + 16}" text-anchor="middle" font-size="9" fill="${pc}" font-family="JetBrains Mono,monospace" font-weight="600">${fmt(currentPrice)}</text>`;
    h += `<text x="${xNow}" y="${H - padB + 14}" text-anchor="middle" font-size="8" fill="${C.textdim}" font-family="JetBrains Mono,monospace">今日</text>`;
  }

  svg.innerHTML = h;
}

// ── BASELINE BUTTON STATE ───────────────────────────
// 按鈕是「判決」不是「邀請」：規則沒成立就鎖住，避免誤觸。
function updateBaselineBtn(price) {
  const btn = document.getElementById('applyTodayBtn');
  if (!btn) return;
  const baseline = state.baseline;
  const ev = evaluateRules(price, baseline);

  btn.classList.remove('btn-rule2', 'locked', 'primary');

  if (!ev.hasPrice) {
    btn.textContent = '先輸入今日收盤';
    btn.classList.add('locked');
    btn.disabled = true;
    return;
  }

  if (ev.verdict === 'rule2') {
    btn.textContent = `⚡ R2 觸發 → 更新為 ${fmt(price)}`;
    btn.classList.add('primary', 'btn-rule2');
    btn.disabled = false;
  } else if (ev.verdict === 'rule1') {
    btn.textContent = `R1 年度重設 → 更新為 ${fmt(price)}`;
    btn.classList.add('primary');
    btn.disabled = false;
  } else {
    btn.textContent = `維持基準 ${fmt(baseline)} · 今日無需更新`;
    btn.classList.add('locked');
    btn.disabled = true;
  }
}

// ── SNAPSHOT LOG ───────────────────────────────────
function addSnapshot() {
  const price = parseFloat(document.getElementById('priceInput').value);
  if (isNaN(price) || price <= 0) { alert('請先輸入今日收盤價'); return; }
  const zone = getZone(price, state.baseline);
  if (!state.snapshots) state.snapshots = [];
  state.snapshots.push({
    date: todayISO(),
    price,
    baseline: state.baseline,
    zone,
    note: ZONE_CONFIG[zone].action.split('\n')[0],
  });
  trackYearHigh(price);
  saveState();
  render();
}

function renderSnapshots() {
  const list = document.getElementById('snapList');
  if (!list) return;
  const snaps = state.snapshots || [];
  if (snaps.length === 0) {
    list.innerHTML = '<div class="empty-history">尚無 Review 紀錄</div>';
    return;
  }
  const zoneClass = { normal: 'zone-normal', warning: 'zone-warning', danger: 'zone-danger', crisis: 'zone-crisis' };
  const yh = yearHigh();
  list.innerHTML = [...snaps].reverse().map((s, i) => {
    const idx = snaps.length - 1 - i;
    const pct = (s.price - s.baseline) / s.baseline * 100;
    const isHigh = yh && s.date === yh.date && s.price === yh.price;
    return `
      <div class="snap-item">
        <div class="snap-date">${isHigh ? '<span class="high-star" title="年度最高">★</span> ' : ''}${s.date}</div>
        <div>
          <div class="snap-price">${fmt(s.price)} <span class="snap-date">/ ${fmt(s.baseline)} · ${fmtPct(pct)}</span></div>
          ${s.note ? `<div class="snap-date" style="margin-top:2px">${s.note}</div>` : ''}
        </div>
        <div class="snap-zone ${zoneClass[s.zone] || ''}">${ZONE_CONFIG[s.zone] ? ZONE_CONFIG[s.zone].name : s.zone}</div>
        <button class="row-del" onclick="deleteSnapshot(${idx})" title="刪除">×</button>
      </div>`;
  }).join('');
}

function deleteSnapshot(i) {
  state.snapshots.splice(i, 1);
  saveState();
  renderSnapshots();
}

function clearSnapshots() {
  if (!confirm('清除所有月度 Review 紀錄？')) return;
  state.snapshots = [];
  saveState();
  renderSnapshots();
}

// ── UNDO ───────────────────────────────────────────
function captureUndo() {
  undoSnapshot = {
    baseline: state.baseline,
    baselineDate: state.baselineDate,
    baselineNote: state.baselineNote,
    historyLen: (state.history || []).length,
  };
}

function showUndoToast(from, to) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = `基準已更新 ${fmt(from)} → ${fmt(to)}`;
  t.classList.add('visible');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => t.classList.remove('visible'), 12000);
}

function undoLastChange() {
  if (!undoSnapshot) return;
  state.baseline     = undoSnapshot.baseline;
  state.baselineDate = undoSnapshot.baselineDate;
  state.baselineNote = undoSnapshot.baselineNote;
  state.history      = (state.history || []).slice(0, undoSnapshot.historyLen);
  undoSnapshot = null;
  clearTimeout(undoTimer);
  document.getElementById('toast').classList.remove('visible');
  saveState();
  render();
}

function deleteHistoryEntry(i) {
  const h = state.history[i];
  if (!confirm(`刪除這筆校準紀錄？\n\n${h.date} · ${fmt(h.baseline)}\n${h.note || ''}\n\n（不會改動目前的有效基準）`)) return;
  state.history.splice(i, 1);
  saveState();
  render();
}

// ── THEME ──────────────────────────────────────────
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  document.getElementById('themeToggle').textContent = isLight ? '☾' : '☀';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  renderChart();
}

function initTheme() {
  const saved = localStorage.getItem('theme');
  const preferLight = saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches);
  if (preferLight) {
    document.documentElement.classList.add('light');
    document.getElementById('themeToggle').textContent = '☾';
  }
}

// ── INIT ───────────────────────────────────────────
initTheme();
loadState();
render();
setStatus('手動輸入模式', false);
</script>
